name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera la cartella android
        run: flutter create --platforms=android --org it.medylab --project-name digital_twin .
      - name: Nome dell'app sul telefono
        run: sed -i 's/android:label="[^"]*"/android:label="Somatwin"/' android/app/src/main/AndroidManifest.xml
      - name: Rimuovi il test d'esempio generato da flutter create
        run: rm -f test/widget_test.dart
      - name: Chiave di firma fissa (per poter aggiornare l'app senza disinstallarla)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: somatwin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Pubblica l'APK come Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk somatwin.apk
          gh release create "build-${{ github.run_number }}" somatwin.apk \
            --title "Somatwin build ${{ github.run_number }}" \
            --notes "APK di prova, firmato con chiave di debug. Commit ${{ github.sha }}."
