name: Publish web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera la cartella web
        run: flutter create --platforms=web --org it.medylab --project-name digital_twin .
      - name: Nome dell'app nel browser
        run: |
          sed -i 's#<title>[^<]*</title>#<title>Somatwin</title>#' web/index.html
          sed -i 's#"name": "[^"]*"#"name": "Somatwin"#; s#"short_name": "[^"]*"#"short_name": "Somatwin"#' web/manifest.json
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
