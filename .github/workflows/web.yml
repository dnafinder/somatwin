name: Publish web
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Genera la cartella web
        run: flutter create --platforms=web --org it.medylab --project-name digital_twin .
      - name: Nome dell'app nel browser
        run: |
          sed -i 's#<title>[^<]*</title>#<title>Somatwin</title>#' web/index.html
          # Senza viewport il telefono disegna la pagina larga ~980 px e rimpicciolisce tutto.
          if ! grep -q 'name="viewport"' web/index.html; then
            sed -i 's#<head>#<head>\n  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">#' web/index.html
          fi
          grep -n viewport web/index.html
          sed -i 's#"name": "[^"]*"#"name": "Somatwin"#; s#"short_name": "[^"]*"#"short_name": "Somatwin"#' web/manifest.json
      - name: Icona e favicon (al posto di quelle di Flutter)
        run: |
          cp ci/icons/Icon-192.png ci/icons/Icon-512.png ci/icons/Icon-maskable-192.png ci/icons/Icon-maskable-512.png web/icons/
          cp ci/icons/favicon.png web/favicon.png
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
