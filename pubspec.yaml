name: digital_twin
description: Digital twin antropometrico e stima del rischio cardiovascolare (MEDyLAB).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  cross_file: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/absi_male.csv
    - assets/absi_female.csv
    - assets/mh/body.bin
